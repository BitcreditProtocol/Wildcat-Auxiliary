[package]
name = "bcr-wdc-relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws", "tokio"] }
axum-raw-websocket = "0.8"
# sha256 for blossom blobs; `nostr` stopped re-exporting `bitcoin_hashes` in 0.45
bitcoin_hashes = { version = "0.14", features = ["serde"] }
chrono.workspace = true
clap = { version = "4.5.39", features = ["derive", "env"] }
deadpool-postgres = "0.14"
futures.workspace = true
nostr = "0.45"
# `nostr-relay-builder` was folded into `nostr-sdk` as the `local-relay` feature
nostr-sdk = { version = "0.45", features = ["local-relay"] }
base64-url = "3"
nostr-postgres-db = { git = "https://github.com/BitcreditProtocol/nostr-postgres-db.git", rev = "f660724604dd22c2995401b8a37ff54b69703429" }
reqwest = { workspace = true, features = ["stream", "rustls-tls"] }
# uncompressed-pubkey check on blossom blobs; `nostr` stopped re-exporting `secp256k1` in 0.45
secp256k1.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tower-http = { version = "0.6.6", features = ["cors"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
# `Keys::generate` in tests needs an OS random source
nostr = { version = "0.45", features = ["os-rng"] }
