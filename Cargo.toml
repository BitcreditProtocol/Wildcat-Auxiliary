[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace]
resolver = "3"
members = [
  "crates/bcr-wdc-eic-service",
  "crates/bcr-wdc-shared",
  "crates/bcr-wdc-relay",
  "crates/bcr-wdc-ens-service",
  "crates/bcr-wdc-ebill-service",
  "crates/bcr-wdc-demo-faucet",
]

[workspace.dependencies]
anyhow = {version = "1"}
async-trait = {version = "0.1"}
axum = {version = "0.8"}
bcr-common = {git = "https://github.com/BitcreditProtocol/bcr-common.git", rev = "72ec8b546fdc64ac93e05f29aad7116aa3047be7"}
bcr-ebill-api = {git = "https://github.com/BitcreditProtocol/Bitcredit-Core.git", rev = "c1f14c3e4c6794a8d9508307bcc22a9085858874"}
bcr-ebill-core = {git = "https://github.com/BitcreditProtocol/Bitcredit-Core.git", rev = "c1f14c3e4c6794a8d9508307bcc22a9085858874"}
bcr-ebill-transport = {git = "https://github.com/BitcreditProtocol/Bitcredit-Core.git", rev = "c1f14c3e4c6794a8d9508307bcc22a9085858874"}
bcr-ebill-persistence = {git = "https://github.com/BitcreditProtocol/Bitcredit-Core.git", rev = "c1f14c3e4c6794a8d9508307bcc22a9085858874"}
bcr-wdc-shared = {path = "./crates/bcr-wdc-shared"}
bip39 = {version = "2"}
bitcoin = {version = "0.32", features = ["serde"]}
borsh = {version = "1.5"}
borsh-derive = {version = "1.5"}
config = {version = "0.15"}
email_address = {version="0.2"}
futures = {version = "0.3"}
rand = {version = "0.10"}
reqwest = {version = "0.12", default-features = false}
secp256k1 = {version = "0.29", features = ["global-context"]}
serde = {version = "1", features = ["derive"]}
serde_json = {version = "1"}
serde_repr = {version= "0.1"}
surrealdb = {version = "2.2"}
thiserror = {version = "2"}
tinytemplate = {version="1.2"}
tokio = {version = "1"}
tracing = {version = "0.1"}
tracing-log = {version = "0.2"}
tracing-subscriber = {version = "0.3"}
time = {version = "0.3", features = ["serde", "formatting", "parsing", "macros"]}
url = {version = "2.5"}
uuid = { version = "1", default-features = false, features = ["v4", "js"] }
