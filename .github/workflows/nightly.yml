name: build and push nightly images

on:
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  packages: write
  attestations: write
  artifact-metadata: write

jobs:
  nightly:
    uses: ./.github/workflows/build-image.yml
    with:
      tags: |
        type=raw,value=nightly
    secrets:
      PRIVATE_REPO_ACCESS_APP_PRIVATE_KEY: ${{ secrets.PRIVATE_REPO_ACCESS_APP_PRIVATE_KEY }}
      GCLOUD_WIF_PROVIDER: ${{ secrets.GCLOUD_WIF_PROVIDER }}
      GCLOUD_SERVICE_ACCOUNT: ${{ secrets.GCLOUD_SERVICE_ACCOUNT }}
